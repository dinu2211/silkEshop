<header class="header">
  <a routerLink="/" class="logo" aria-label="Weave Made home">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 100 66" focusable="false">
        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 10h9l12 43L48 13l19 40 14-43h11" stroke-width="2.4" />
          <path d="M4 7h16M80 7h16" stroke-width="1.3" />
          <path d="M48 8c-7-7-17-2-16 7 1 8 14 14 21 20 8 7 9 18 2 24-8 7-21 3-23-7" stroke-width="1.5" />
        </g>
      </svg>
    </span>
    <span class="logo-copy">
      <span class="logo-name">Weave Made</span>
      <span class="logo-tagline">Threads of Tradition</span>
    </span>
  </a>

  <nav class="header-nav" aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >Home</a>
    <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Contact</a>
    <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">About</a>
  </nav>

  <button
    class="cart-link"
    type="button"
    aria-label="Open cart"
    [attr.aria-expanded]="isCartOpen"
    (click)="isCartOpen = true"
  >
    <mat-icon
      [matBadge]="cartService.itemCount()"
      [matBadgeHidden]="cartService.itemCount() === 0"
      matBadgeColor="warn"
    >shopping_bag</mat-icon>
    <span class="cart-label">Cart</span>
  </button>
</header>

<main class="content">
  <ng-content></ng-content>
</main>

@if (isCartOpen) {
  <app-view-cart (close)="isCartOpen = false" />
}
